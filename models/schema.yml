version: 2

models:
  - name: my_first_dbt_model
    description: "A starter dbt model generating static colors data"
    columns:
      - name: id
        description: "The primary key for this model"
        tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    description: "A model that filters the first model"
    columns:
      - name: id
        description: "The primary key for this model"
        tests:
          - unique
          - not_null
